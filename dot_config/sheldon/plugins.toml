# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

[plugins]

# Completion directories must be on fpath before compinit.
[plugins.local-completions]
local = "~/.config/zsh/completions"
apply = ["fpath"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]

[plugins.compinit]
inline = '''
autoload -Uz compinit
compinit
'''

[plugins.mise]
inline = 'eval "$("$HOME/.local/bin/mise" activate zsh)"'

# zoxide and atuin require compinit to have run first.
[plugins.zoxide]
inline = 'eval "$(zoxide init zsh --cmd j)"'

[plugins.atuin]
inline = 'eval "$(atuin init zsh)"'

# Use emacs keymap before plugins register their key bindings.
[plugins.emacs-keymap]
inline = 'bindkey -e'

# fzf-tab must load after compinit and before widget-wrapping plugins.
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-ssh]
github = "sunlei/zsh-ssh"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]

[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"

[plugins.forgit]
github = "wfxr/forgit"

[plugins.dir-meow]
github = "Elliot-32/dir-meow"
proto = "ssh"

# Keep syntax highlighting last among plugins.
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

# For example:
#
# [plugins.base16]
# github = "chriskempson/base16-shell"
