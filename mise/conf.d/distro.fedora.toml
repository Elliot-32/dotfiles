[bootstrap.hooks.pre-packages]
run = '''
if ! dnf copr --help >/dev/null 2>&1; then
  if command -v dnf5 >/dev/null 2>&1; then
    sudo dnf install --assumeyes dnf5-plugins
  else
    sudo dnf install --assumeyes dnf-plugins-core
  fi
fi

sudo dnf copr enable --assumeyes scottames/ghostty
'''

[bootstrap.packages]
"dnf:ghostty" = "latest"

[dotfiles]
"~/.config/ghostty/config" = {}
"~/.config/xdg-terminals.list" = {}
"~/.local/share/xdg-terminals/com.mitchellh.ghostty.desktop" = "/usr/share/applications/com.mitchellh.ghostty.desktop"
