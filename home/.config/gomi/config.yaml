core:
  trash:
    strategy: xdg
    home_fallback: true
    forbidden_paths:
      - "$HOME/.local/share/Trash"
      - "$HOME/.trash"
      - "$XDG_DATA_HOME/Trash"
      - "/tmp/Trash"
      - "/var/tmp/Trash"
      - "$HOME/.gomi"
      - "$HOME/.config/mise"
      - "$HOME/.miserc.toml"
      - "$HOME/.config/topgrade.toml"
      - "$HOME/.config/topgrade.systemd.toml"
      - "/"
      - "/etc"
      - "/usr"
      - "/var"
      - "/bin"
      - "/sbin"
      - "/lib"
      - "/lib64"

ui:
  preview:
    syntax_highlight: true
    colorscheme: catppuccin-mocha
    directory_command: eza -la --icons=always --color=always

logging:
  enabled: true
  level: info
  rotation:
    max_size: 10MB
    max_files: 3
