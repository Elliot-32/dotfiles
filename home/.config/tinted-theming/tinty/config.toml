default-scheme = "base16-mocha"

[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
supported-systems = ["base16", "base24"]
hook = '''
config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/ghostty/themes"
mkdir -p "$config_dir"
cp -f "$TINTY_THEME_FILE_PATH" "$config_dir/tinted-theming"
killall -SIGUSR2 ghostty 2>/dev/null || true
'''

[[items]]
name = "dotfiles-gomi"
path = "~/.config/tinted-theming/tinty"
themes-dir = "themes/gomi"
supported-systems = ["base16", "base24"]
hook = '''
if [ ! -x /usr/bin/omarchy ] && [ ! -d /usr/share/omarchy ]; then
  config_dir="${XDG_CONFIG_HOME:-$HOME/.config}/gomi"
  mkdir -p "$config_dir"
  rm -f "$config_dir/config.yaml"
  cp -f "$TINTY_THEME_FILE_PATH" "$config_dir/config.yaml"
fi
'''

[[items]]
name = "dotfiles-windows-terminal"
path = "~/.config/tinted-theming/tinty"
themes-dir = "themes/windows-terminal"
supported-systems = ["base16", "base24"]
hook = '''
if command -v powershell.exe >/dev/null 2>&1 && command -v wslpath >/dev/null 2>&1; then
  windows_path="$(powershell.exe -NoLogo -NoProfile -Command '[Environment]::GetFolderPath("LocalApplicationData")' | tr -d '\r')"
  if [ -n "$windows_path" ]; then
    local_appdata="$(wslpath -u "$windows_path")"
    for state_directory in \
      "$local_appdata/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState" \
      "$local_appdata/Packages/Microsoft.WindowsTerminalPreview_8wekyb3d8bbwe/LocalState" \
      "$local_appdata/Packages/Microsoft.WindowsTerminalCanary_8wekyb3d8bbwe/LocalState" \
      "$local_appdata/Microsoft/Windows Terminal"
    do
      [ -f "$state_directory/settings.json" ] || continue
      cp -f "$TINTY_THEME_FILE_PATH" "$state_directory/palette.json"
    done
  fi
fi
'''
