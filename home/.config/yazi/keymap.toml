#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = "p"
run = "plugin smart-paste"
desc = "Paste into hovered directory or CWD"

[[mgr.prepend_keymap]]
on = [ "g", "v" ]
run = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = "plugin diff"
desc = "Diff selected and hovered files"

[[mgr.prepend_keymap]]
on = [ "c", "m" ]
run = "plugin chmod"
desc = "Chmod selected files"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview pane"

[[mgr.prepend_keymap]]
on = "y"
run = [ "yank", 'plugin clipboard -- --action=copy' ]
desc = "Yank selected files and copy to system clipboard"

[[mgr.prepend_keymap]]
on = "x"
run = [ "yank --cut", 'plugin clipboard -- --action=copy' ]
desc = "Cut selected files and copy to system clipboard"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = 'plugin clipboard -- --action=paste'
desc = "Paste files from system clipboard"
