min_version = "2026.8.3"

[settings]
auto_update = true
dotfiles.default_mode = "symlink"

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.cargo/bin",
]
EDITOR = "nvim"
VISUAL = "nvim"
SUDO_EDITOR = "nvim"

[shell_alias]
ls = "eza --icons=auto"
oc = "opencode"
rm = "gomi"
path = "j $(print -l $path | fzf)"

[tools]
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
cargo-binstall = "latest"
cowsay = "latest"
dasel = "latest"
doggo = "latest"
duf = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gup = "latest"
herdr = "latest"
lazyjournal = "latest"
lazyssh = "latest"
neovim = "latest"
node = "latest"
nub = "latest"
opencode = "latest"
qdns = "latest"
ripgrep = "latest"
sheldon = "latest"
tlrc = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"
"cargo:rustscan" = "latest"
"github:lazywalker/rgrc" = "latest"
"go:github.com/babarot/gomi" = "latest"
"go:github.com/projectdiscovery/subfinder/v2/cmd/subfinder" = "latest"
"pipx:isd-tui" = "latest"

[bootstrap.packages]
"apt:openssh-client" = "latest"
"apt:zsh" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
"~/.config/mise/config.desktop.toml" = "~/.dotfiles/mise.desktop.toml"
"~/.config/mise/miserc.toml" = "~/.dotfiles/.miserc.toml"
"~/.zshrc" = {}
"~/.p10k.zsh" = {}
"~/.gitconfig" = {}
"~/.config/sheldon/plugins.toml" = {}

[bootstrap.mise_shell_activate]
zprofile = "shims"
bash = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.linux.systemd.units.gomi-prune]
description = "Prune gomi trash older than 30 days"
type = "oneshot"
exec_start = "~/.local/bin/mise exec -- gomi --force --prune=30d"
wanted_by = []
start = false

[bootstrap.linux.systemd.units.gomi-prune-timer]
description = "Hourly gomi trash pruning"
on_calendar = "hourly"
persistent = true
unit = "gomi-prune"

[tasks.bootstrap]
description = "Finish dotfiles bootstrap"
run = "sheldon --non-interactive lock"
