min_version = "2026.8.3"

[settings]
auto_update = true
dotfiles.default_mode = "symlink"

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.cargo/bin",
]
EDITOR = "nvim"
VISUAL = "nvim"
SUDO_EDITOR = "nvim"

[shell_alias]
ls = "eza --icons"
oc = "opencode"
rm = "gomi"
path = "j $(print -l $path | fzf)"

[tools]
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
cargo-binstall = "latest"
cowsay = "latest"
dasel = "latest"
doggo = "latest"
duf = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gup = "latest"
herdr = "latest"
lazyjournal = "latest"
lazyssh = "latest"
neovim = "latest"
node = "latest"
nub = "latest"
opencode = "latest"
qdns = "latest"
ripgrep = "latest"
sheldon = "latest"
tlrc = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"
"cargo:rustscan" = "latest"
"github:lazywalker/rgrc" = "latest"
"go:github.com/babarot/gomi" = "latest"
"go:github.com/projectdiscovery/subfinder/v2/cmd/subfinder" = "latest"
"pipx:isd-tui" = "latest"

[bootstrap.hooks.pre-packages]
run = 'sh "$HOME/.dotfiles/scripts/bootstrap-pre-packages.sh"'

[bootstrap.packages]
"apt:fcitx5" = "latest"
"apt:fcitx5-chewing" = "latest"
"apt:fcitx5-frontend-all" = "latest"
"apt:ghostty" = "latest"
"apt:openssh-client" = "latest"
"apt:software-properties-common" = "latest"
"apt:wl-clipboard" = "latest"
"apt:zsh" = "latest"
"flatpak-user:com.bitwarden.desktop" = "latest"
"flatpak-user:com.borgbase.Vorta" = "latest"
"flatpak-user:com.dec05eba.gpu_screen_recorder" = "latest"
"flatpak-user:com.github.Matoking.protontricks" = "latest"
"flatpak-user:com.github.marhkb.Pods" = "latest"
"flatpak-user:com.github.tchx84.Flatseal" = "latest"
"flatpak-user:com.heroicgameslauncher.hgl" = "latest"
"flatpak-user:com.obsproject.Studio" = "latest"
"flatpak-user:com.ranfdev.DistroShelf" = "latest"
"flatpak-user:com.rustdesk.RustDesk" = "latest"
"flatpak-user:com.usebottles.bottles" = "latest"
"flatpak-user:com.vysp3r.ProtonPlus" = "latest"
"flatpak-user:dev.vencord.Vesktop" = "latest"
"flatpak-user:dev.zed.Zed" = "latest"
"flatpak-user:io.ente.auth" = "latest"
"flatpak-user:io.github.avomar.dev-toolbox" = "latest"
"flatpak-user:io.github.flattool.Warehouse" = "latest"
"flatpak-user:io.github.ilya_zlobintsev.LACT" = "latest"
"flatpak-user:io.github.wiiznokes.fan-control" = "latest"
"flatpak-user:io.github.zarestia_dev.rclone-manager" = "latest"
"flatpak-user:io.missioncenter.MissionCenter" = "latest"
"flatpak-user:io.podman_desktop.PodmanDesktop" = "latest"
"flatpak-user:it.mijorus.gearlever" = "latest"
"flatpak-user:md.obsidian.Obsidian" = "latest"
"flatpak-user:net.nokyan.Resources" = "latest"
"flatpak-user:net.retrodeck.retrodeck" = "latest"
"flatpak-user:org.audacityteam.Audacity" = "latest"
"flatpak-user:org.gnome.Calculator" = "latest"
"flatpak-user:org.localsend.localsend_app" = "latest"
"flatpak-user:org.nickvision.tubeconverter" = "latest"
"flatpak-user:org.onlyoffice.desktopeditors" = "latest"
"flatpak-user:org.signal.Signal" = "latest"
"flatpak-user:org.telegram.desktop" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
"~/.zshrc" = {}
"~/.p10k.zsh" = {}
"~/.gitconfig" = {}
"~/.config/ghostty/config" = {}
"~/.config/fcitx5/profile" = {}
"~/.config/environment.d/90-fcitx5.conf" = {}
"~/.config/sheldon/plugins.toml" = {}

[bootstrap.mise_shell_activate]
zprofile = "shims"
bash = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.linux.systemd.units.gomi-prune]
description = "Prune gomi trash older than 30 days"
type = "oneshot"
exec_start = "~/.local/bin/mise exec -- gomi --force --prune=30d"
wanted_by = []
start = false

[bootstrap.linux.systemd.units.gomi-prune-timer]
description = "Hourly gomi trash pruning"
on_calendar = "hourly"
persistent = true
unit = "gomi-prune"

[tasks.bootstrap]
description = "Finish dotfiles bootstrap"
run = "sheldon --non-interactive lock"
