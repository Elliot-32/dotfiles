min_version = "2026.8.3"

[settings]
auto_update = true
dotfiles.default_mode = "symlink"

[settings.github]
use_git_credentials = true

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.cargo/bin",
]
EDITOR = "nvim"
VISUAL = "nvim"
SUDO_EDITOR = "nvim"

[shell_alias]
ls = "eza --icons=auto"
oc = "opencode"
rm = "gomi"
path = "j $(print -l $path | fzf)"
n = "nvim"
sl = "systemctl"

[tools]
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
cargo-binstall = "latest"
cowsay = "latest"
dasel = "latest"
doggo = "latest"
duf = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gum = "latest"
gup = "latest"
herdr = "latest"
lazyjournal = "latest"
lazyssh = "latest"
neovim = "latest"
node = "latest"
nub = "latest"
opencode = "latest"
qdns = "latest"
ripgrep = "latest"
sheldon = "latest"
tlrc = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"
"cargo:rustscan" = "latest"
"github:Giammarco-Ferranti/deja" = "latest"
"github:lazywalker/rgrc" = "latest"
"go:github.com/babarot/gomi" = "latest"
"go:github.com/projectdiscovery/subfinder/v2/cmd/subfinder" = "latest"
"pipx:isd-tui" = "latest"
"github:alltuner/mise-completions-sync" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
"~/.config/mise/conf.d/distro.ubuntu.toml" = "~/.dotfiles/mise/conf.d/distro.ubuntu.toml"
"~/.config/mise/conf.d/distro.fedora.toml" = "~/.dotfiles/mise/conf.d/distro.fedora.toml"
"~/.config/mise/conf.d/distro.arch.toml" = "~/.dotfiles/mise/conf.d/distro.arch.toml"
"~/.config/mise/conf.d/packages.apt.toml" = "~/.dotfiles/mise/conf.d/packages.apt.toml"
"~/.config/mise/conf.d/packages.dnf.toml" = "~/.dotfiles/mise/conf.d/packages.dnf.toml"
"~/.config/mise/conf.d/packages.pacman.toml" = "~/.dotfiles/mise/conf.d/packages.pacman.toml"
"~/.config/mise/conf.d/role.desktop.toml" = "~/.dotfiles/mise/conf.d/role.desktop.toml"
"~/.config/mise/miserc.toml" = "~/.dotfiles/.miserc.toml"
"~/.gitconfig/defaults" = { block = '''
[push]
	autoSetupRemote = true

[fetch]
	prune = true
''' }
"~/.zshrc" = {}
"~/.p10k.zsh" = {}
"~/.config/sheldon/plugins.toml" = {}
"~/.local/share/mise-completions-sync/registry.toml" = {}

[bootstrap.mise_shell_activate]
zprofile = "shims"
bash = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.linux.systemd.units.gomi-prune]
description = "Prune gomi trash older than 30 days"
type = "oneshot"
exec_start = "~/.local/bin/mise exec -- gomi --force --prune=30d"
wanted_by = []
start = false

[bootstrap.linux.systemd.units.gomi-prune-timer]
description = "Hourly gomi trash pruning"
on_calendar = "hourly"
persistent = true
unit = "gomi-prune"

[bootstrap.linux.systemd.units.update]
description = "Update mise tools, Flatpak apps, Sheldon plugins, and completions"
type = "oneshot"
exec_start = "%h/.local/bin/mise -C %h/.dotfiles run update"
wanted_by = []
start = false

[bootstrap.linux.systemd.units.update-timer]
description = "Daily mise update"
on_calendar = "daily"
persistent = true
unit = "update"

[tasks.bootstrap]
description = "Finish dotfiles bootstrap"
run = [
  "mise completion zsh --install",
  "misecompsync --shell zsh",
  "sheldon --non-interactive lock",
]

[bootstrap.hooks.final]
run = "mise exec -- sh ./scripts/login-github.sh"

[tasks.update]
description = "Update tools, Sheldon plugins, and completions"
run = '''
mise upgrade

case ",${MISE_ENV:-}," in
  *,desktop,*)
    mise run update:desktop
    ;;
esac

mise completion zsh --install
sheldon --non-interactive lock --update
misecompsync --shell zsh
'''

[hooks]
postinstall = "misecompsync --new-only --shell zsh"
