[bootstrap.hooks.pre-packages]
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/bootstrap-ghostty-ubuntu.sh"'

[bootstrap.packages]
"apt:ghostty" = "latest"

[dotfiles]
"~/.config/ghostty/config" = {}
"~/.config/xdg-terminals.list" = {}
"~/.local/share/xdg-terminals/com.mitchellh.ghostty.desktop" = "/usr/share/applications/com.mitchellh.ghostty.desktop"
