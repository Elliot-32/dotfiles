[misc]
assume_yes = true
ask_retry = false
notify_end = "never"
sudo_loop = true
disable = [
  # Managed by mise; keep Topgrade steps that only update plugins/data.
  "atuin",
  "bun",
  "bun_packages",
  "cargo",
  "codex",
  "go",
  "node",
  "opencode",
  "pipx",
  "rustup",
  "self_update",
  "uv",
]

[git]
pull_predefined = false

[flatpak]
use_sudo = false

[commands]
"Nerd Fonts" = 'mise run update:fonts'

[post_commands]
"Refresh completions" = 'mise completion zsh --install && misecompsync --shell zsh'
"Commit mise lockfile" = '''repo="${MISE_CONFIG_DIR:-$HOME/.config/mise}"; if [ -n "$(git -C "$repo" status --porcelain -- mise.lock)" ]; then git -C "$repo" add -- mise.lock && git -C "$repo" commit --only -m "chore: update mise lockfile" -- mise.lock && git -C "$repo" push; fi'''
