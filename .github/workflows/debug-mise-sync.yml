name: Debug mise sync

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          install: false
          cache: false
          env: false

      - name: Reproduce setup validation
        shell: bash
        run: |
          set -euo pipefail

          setup_work="$RUNNER_TEMP/setup-work"
          mkdir -p "$setup_work"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C "$setup_work" -xf -
          git -C "$setup_work" init -q -b main
          git -C "$setup_work" add .
          git -C "$setup_work" -c user.name=CI -c user.email=ci@example.invalid commit -qm debug

          fresh_user="mise-sync-debug"
          fresh_home="/tmp/mise-sync-debug-home"
          setup_bare="/tmp/mise-sync-debug-setup.git"
          mise_bin="/tmp/mise-sync-debug-bin"
          sudo rm -rf "$fresh_home" "$setup_bare" "$mise_bin"
          sudo useradd --create-home --home-dir "$fresh_home" --shell /bin/bash "$fresh_user"
          git clone --bare "$setup_work" "$setup_bare"
          sudo chown -R "$fresh_user:$fresh_user" "$setup_bare" "$fresh_home"
          cp "$HOME/.local/share/mise/bin/mise" "$mise_bin"
          chmod 0755 "$mise_bin"

          fresh_config="$fresh_home/custom/mise"
          fresh_state="$fresh_home/.local/state/mise"
          fresh_data="$fresh_home/.local/share/mise"
          fresh_cache="$fresh_home/.cache/mise"

          run_fresh() {
            sudo -u "$fresh_user" env -i \
              HOME="$fresh_home" \
              XDG_CONFIG_HOME="$fresh_home/.config" \
              XDG_STATE_HOME="$fresh_home/.local/state" \
              MISE_CONFIG_DIR="$fresh_config" \
              MISE_STATE_DIR="$fresh_state" \
              MISE_DATA_DIR="$fresh_data" \
              MISE_CACHE_DIR="$fresh_cache" \
              MISE_GLOBAL_CONFIG_ROOT="$fresh_home" \
              MISE_TRUSTED_CONFIG_PATHS="$fresh_config" \
              MISE_YES=1 \
              PATH="/usr/local/bin:/usr/bin:/bin" \
              sh -c 'cd "$HOME" && exec "$@"' sh "$@"
          }

          run_fresh "$mise_bin" bootstrap --from-git "file://$setup_bare" --only dotfiles --yes

          check() {
            local label="$1"
            shift
            echo "CHECK: $label"
            "$@"
          }

          check home-miserc test -f "$fresh_home/.miserc.toml"
          check no-config-miserc test ! -e "$fresh_config/miserc.toml"
          check config test -f "$fresh_config/config.toml"
          check lock test -f "$fresh_config/mise.lock"
          check local-config test -f "$fresh_config/config.local.toml"
          check no-default-config test ! -e "$fresh_home/.config/mise/config.toml"
          check miserc-content cmp "$fresh_home/.miserc.toml" "$GITHUB_WORKSPACE/home/.miserc.toml"
          check lock-content cmp "$fresh_config/mise.lock" "$GITHUB_WORKSPACE/config/mise.lock"

          echo 'CHECK: paths-json'
          paths_json="$(run_fresh "$mise_bin" bootstrap dotfiles paths --json)"
          printf '%s\n' "$paths_json"
          jq -e 'any(.entries[]; .path == "~/.miserc.toml")' <<<"$paths_json" >/dev/null
          jq -e 'any(.entries[]; .path == "~/custom/mise/mise.lock")' <<<"$paths_json" >/dev/null
          jq -e 'all(.entries[]; (.path | startswith("~/.config/mise/") | not))' <<<"$paths_json" >/dev/null

          echo 'CHECK: config-ls'
          config_ls="$(run_fresh "$mise_bin" config ls)"
          printf '%s\n' "$config_ls"
          grep -Fq "$fresh_config/conf.d/distro.ubuntu.toml" <<<"$config_ls"
          grep -Fq "$fresh_config/conf.d/packages.apt.toml" <<<"$config_ls"

          echo 'CHECK: status'
          run_fresh "$mise_bin" bootstrap dotfiles status
