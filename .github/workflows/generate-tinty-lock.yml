name: Generate Tinty lock entry

on:
  push:
    branches:
      - feat/tinty-omarchy-theme-templates
    paths:
      - .github/workflows/generate-tinty-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      MISE_ENV_CONF_D: true
      MISE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tinty-omarchy-theme-templates
          fetch-depth: 0

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate only the Tinty lock entry
        run: |
          git checkout origin/master -- config/mise.lock
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE/config" "$HOME/.config/mise"
          mise lock --global cargo:tinty

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- config/mise.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/mise.lock
          git commit -m "chore: lock tinty"
          git push origin HEAD:feat/tinty-omarchy-theme-templates
