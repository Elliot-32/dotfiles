name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/config
      MISE_YES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare mise
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE/config" "$HOME/.config/mise"
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install validation tools
        run: mise install --locked hk shellcheck

      - name: Run static checks
        working-directory: config
        run: mise exec hk shellcheck -- hk check --all

      - name: Validate mise
        run: |
          mise tasks validate --errors-only
          mise bootstrap --dry-run

      - name: Validate profiles
        shell: bash
        run: |
          test "$(MISE_ENV=arch,pacman mise settings get disable_tools)" = '["github:ryanoasis/nerd-fonts"]'
          test "$(MISE_ENV=arch,pacman,omarchy mise settings get disable_tools)" = '["github:ryanoasis/nerd-fonts", "github:tinted-theming/tinty"]'

          tinty_task="$(MISE_ENV=ubuntu,apt mise tasks info bootstrap:theme --json)"
          jq -e 'any(.run[]; . == "tinty sync") and any(.run[]; . == "tinty init")' <<<"$tinty_task" >/dev/null

          omarchy_task="$(MISE_ENV=arch,pacman,omarchy mise tasks info bootstrap:theme --json)"
          jq -e '.run == [":"]' <<<"$omarchy_task" >/dev/null

          wsl_task="$(MISE_ENV=wsl mise tasks info bootstrap:windows --json)"
          grep -Fq 'scripts/bootstrap-windows.sh' <<<"$wsl_task"
          grep -Fq 'scripts/bootstrap-windows-terminal.sh' <<<"$wsl_task"
          grep -Fq '"hide": false' <<<"$wsl_task"

          output="$(sh config/scripts/bootstrap-windows.sh 2>&1)"
          grep -Fq 'powershell.exe is unavailable; skipping Windows bootstrap' <<<"$output"

          test_root="$(mktemp -d)"
          mkdir -p "$test_root/bin" "$test_root/localappdata"
          printf '#!/bin/sh\nexit 99\n' >"$test_root/bin/powershell.exe"
          chmod +x "$test_root/bin/powershell.exe"
          printf '{}\n' >"$test_root/rendered.json"
          PATH="$test_root/bin:$PATH" TINTY_WINDOWS_LOCALAPPDATA="$test_root/localappdata" \
            sh config/scripts/tinty-windows-terminal.sh "$test_root/rendered.json"
          rm -rf "$test_root"

          laptop_task="$(MISE_ENV=laptop mise tasks info laptop:apply --json)"
          grep -Fq 'keyd is required' <<<"$laptop_task"
          grep -Fxq 'sysrq = layer(meta)' config/assets/keyd/laptop.conf
          grep -Fxq 'sysrq = sysrq' config/assets/keyd/laptop.conf

          zsh config/tests/terminal-notify.zsh
          jq -e '.profiles.defaults["compatibility.allowOSC777"] == true' config/windows-terminal/notification.json >/dev/null
          grep -Fxq 'delivery = "terminal"' home/.config/herdr/config.toml

          grep -Fxq 'DefaultIM=mcbopomofo' home/.config/fcitx5/profile
          grep -Fxq 'Name=mcbopomofo' home/.config/fcitx5/profile
          ! grep -Fxq 'Name=chewing' home/.config/fcitx5/profile

          ! grep -Fq 'org.fcitx.Fcitx5' config/config.flatpak.toml

          grep -Fq '"flatpak-user:org.fcitx.Fcitx5" = "latest"' config/config.fcitx-flatpak.toml
          grep -Fq '"flatpak-user:org.fcitx.Fcitx5.Addon.McBopomofo" = "latest"' config/config.fcitx-flatpak.toml

          fcitx_autostart='[bootstrap.files."~/.config/autostart/org.fcitx.Fcitx5.desktop"]'
          grep -Fq "$fcitx_autostart" config/config.fcitx-flatpak.toml
          grep -Fq 'Exec=flatpak run --user org.fcitx.Fcitx5' config/config.fcitx-flatpak.toml
          ! grep -Fq "$fcitx_autostart" config/conf.d/packages.apt.toml
          ! grep -Fq "$fcitx_autostart" config/conf.d/packages.dnf.toml
          ! grep -Fq "$fcitx_autostart" config/conf.d/packages.pacman.toml

          grep -Fq '"pacman:fcitx5" = "latest"' config/conf.d/packages.pacman.toml
          grep -Fq '"pacman:fcitx5-configtool" = "latest"' config/conf.d/packages.pacman.toml
          grep -Fq '"pacman:fcitx5-chewing" = { state = "absent" }' config/conf.d/packages.pacman.toml
          grep -Fq '"pacman:fcitx5-gtk" = "latest"' config/conf.d/packages.pacman.toml
          grep -Fq '"pacman:fcitx5-qt" = "latest"' config/conf.d/packages.pacman.toml
          grep -Fq '"pacman:fcitx5-chinese-addons" = "latest"' config/conf.d/packages.pacman.toml
          grep -Fq '"apt:git" = "latest"' config/conf.d/packages.apt.toml
          grep -Fq '"dnf:git" = "latest"' config/conf.d/packages.dnf.toml
          grep -Fq 'https://github.com/catppuccin/fcitx5.git' config/scripts/sync-fcitx5-themes.sh
          grep -Fq 'https://github.com/sanweiya/fcitx5-mellow-themes.git' config/scripts/sync-fcitx5-themes.sh
          grep -Fq 'enable-rounded.sh' config/scripts/sync-fcitx5-themes.sh
          grep -Fq '.var/app/$flatpak_app/data/fcitx5/themes' config/scripts/sync-fcitx5-themes.sh
          grep -Fq '[bootstrap.hooks.pre-dotfiles]' config/config.toml
          grep -Fq '[bootstrap.hooks.post-dotfiles]' config/config.toml
          grep -Fq 'scripts/sync-fcitx5-themes.sh' config/config.toml
          grep -Fq 'scripts/reload-fcitx5.sh' config/config.toml
          ! grep -Fq '"~/.local/share/fcitx5/themes"' config/config.toml
          grep -Fq '"aur:fcitx5-mcbopomofo-git" = "latest"' config/conf.d/packages.pacman.toml
          ! grep -Eq 'fcitx5-(material-color|nord|breeze|skin-fluentdark)' config/conf.d/packages.pacman.toml
          ! grep -Fq '"aur:paru"' config/conf.d/packages.pacman.toml
          test -e config/scripts/bootstrap-paru.sh

          ! grep -Fq 'mcbopomofo' config/conf.d/packages.apt.toml
          ! grep -Fq 'mcbopomofo' config/conf.d/packages.dnf.toml
          test ! -e config/scripts/install-mcbopomofo.sh

          grep -Fq '"Fcitx5 themes"' config/assets/topgrade.toml
          grep -Fq '"Fcitx5 themes"' config/assets/topgrade.omarchy.toml
          grep -Fq '"Fcitx5 themes"' home/.config/topgrade.systemd.toml
          grep -Fq 'scripts/reload-fcitx5.sh' config/assets/topgrade.toml
          grep -Fq 'scripts/reload-fcitx5.sh' config/assets/topgrade.omarchy.toml
          grep -Fq 'scripts/reload-fcitx5.sh' home/.config/topgrade.systemd.toml

          reload_log="$RUNNER_TEMP/fcitx5-reload.log"
          fake_bin="$RUNNER_TEMP/fcitx5-native-bin"
          mkdir -p "$fake_bin"
          cat >"$fake_bin/fcitx5-remote" <<'EOF'
          #!/bin/sh
          printf 'native:%s\n' "$*" >>"$FCITX5_RELOAD_LOG"
          EOF
          chmod +x "$fake_bin/fcitx5-remote"
          FCITX5_RELOAD_LOG="$reload_log" PATH="$fake_bin" /bin/sh config/scripts/reload-fcitx5.sh
          grep -Fxq 'native:--check' "$reload_log"
          grep -Fxq 'native:-r' "$reload_log"

          reload_log="$RUNNER_TEMP/fcitx5-flatpak-reload.log"
          fake_bin="$RUNNER_TEMP/fcitx5-flatpak-bin"
          mkdir -p "$fake_bin"
          cat >"$fake_bin/flatpak" <<'EOF'
          #!/bin/sh
          printf 'flatpak:%s\n' "$*" >>"$FCITX5_RELOAD_LOG"
          EOF
          chmod +x "$fake_bin/flatpak"
          FCITX5_RELOAD_LOG="$reload_log" PATH="$fake_bin" /bin/sh config/scripts/reload-fcitx5.sh
          grep -Fxq 'flatpak:info --user org.fcitx.Fcitx5' "$reload_log"
          grep -Fxq 'flatpak:run --user --command=fcitx5-remote org.fcitx.Fcitx5 --check' "$reload_log"
          grep -Fxq 'flatpak:run --user --command=fcitx5-remote org.fcitx.Fcitx5 -r' "$reload_log"

      - name: Validate config selection
        shell: bash
        run: |
          check_config() {
            local envs="$1"
            shift

            local output
            output="$(MISE_ENV="$envs" mise config ls)"

            local expected
            for expected in "$@"; do
              grep -Fq "$expected" <<<"$output"
            done
          }

          check_config "ubuntu,apt" "conf.d/distro.ubuntu.toml" "conf.d/packages.apt.toml"
          check_config "fedora,dnf" "conf.d/distro.fedora.toml" "conf.d/packages.dnf.toml"
          check_config "arch,pacman" "conf.d/packages.pacman.toml"
          check_config "flatpak" "config.flatpak.toml"
          check_config "flatpak,fcitx-flatpak" "config.flatpak.toml" "config.fcitx-flatpak.toml"

          arch_flatpak_output="$(MISE_ENV=arch,pacman,flatpak mise config ls)"
          grep -Fq "config.flatpak.toml" <<<"$arch_flatpak_output"
          ! grep -Fq "config.fcitx-flatpak.toml" <<<"$arch_flatpak_output"

          non_arch_flatpak_output="$(MISE_ENV=ubuntu,apt,flatpak,fcitx-flatpak mise config ls)"
          grep -Fq "config.fcitx-flatpak.toml" <<<"$non_arch_flatpak_output"

          arch_theme_hook="$(MISE_ENV=arch,pacman mise config get --file config/config.toml bootstrap.hooks.pre-dotfiles.run)"
          grep -Fq 'scripts/sync-fcitx5-themes.sh' <<<"$arch_theme_hook"

          flatpak_theme_hook="$(MISE_ENV=ubuntu,apt,flatpak,fcitx-flatpak mise config get --file config/config.toml bootstrap.hooks.pre-dotfiles.run)"
          grep -Fq 'scripts/sync-fcitx5-themes.sh' <<<"$flatpak_theme_hook"

          arch_reload_hook="$(MISE_ENV=arch,pacman mise config get --file config/config.toml bootstrap.hooks.post-dotfiles.run)"
          grep -Fq 'scripts/reload-fcitx5.sh' <<<"$arch_reload_hook"

          flatpak_reload_hook="$(MISE_ENV=ubuntu,apt,flatpak,fcitx-flatpak mise config get --file config/config.toml bootstrap.hooks.post-dotfiles.run)"
          grep -Fq 'scripts/reload-fcitx5.sh' <<<"$flatpak_reload_hook"

          check_config "wsl" "conf.d/platform.wsl.toml"
          check_config "laptop" "conf.d/platform.laptop.toml"
          check_config "arch,pacman,omarchy" "conf.d/platform.omarchy.toml"


          outside_home_output="$(cd "$RUNNER_TEMP" && mise config ls 2>&1)"
          grep -Fq "conf.d/distro.ubuntu.toml" <<<"$outside_home_output"
          grep -Fq "conf.d/packages.apt.toml" <<<"$outside_home_output"
          ! grep -Fq "dotted_conf_d_filename" <<<"$outside_home_output"

      - name: Validate custom service paths
        shell: bash
        run: |
          custom_config="$RUNNER_TEMP/custom-mise"
          cp -a config "$custom_config"

          fake_bin="$RUNNER_TEMP/fake-systemctl"
          mkdir -p "$fake_bin"
          printf '#!/bin/sh\nexit 0\n' >"$fake_bin/systemctl"
          chmod +x "$fake_bin/systemctl"

          MISE_CONFIG_DIR="$custom_config" \
            MISE_TRUSTED_CONFIG_PATHS="$custom_config" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/fake-systemd-bus" \
            PATH="$fake_bin:$PATH" \
            mise bootstrap linux systemd-units apply --yes

          for unit in gomi-prune update; do
            grep -Fq "Environment=\"MISE_CONFIG_DIR=$custom_config\"" \
              "$HOME/.config/systemd/user/dev.mise.$unit.service"
          done

      - name: Validate fresh onboarding
        shell: bash
        run: |
          setup_work="$RUNNER_TEMP/setup-work"
          mkdir -p "$setup_work"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C "$setup_work" -xf -
          git -C "$setup_work" init -q -b main
          git -C "$setup_work" add .
          git -C "$setup_work" -c user.name=CI -c user.email=ci@example.invalid commit -qm 'test: setup repository'

          fresh_user="mise-sync-ci"
          fresh_home="/tmp/mise-sync-home"
          setup_bare="/tmp/mise-sync-setup.git"
          mise_bin="/tmp/mise-sync-ci-bin"
          sudo rm -rf "$fresh_home" "$setup_bare" "$mise_bin"
          sudo useradd --create-home --home-dir "$fresh_home" --shell /bin/bash "$fresh_user"

          git clone --bare "$setup_work" "$setup_bare"
          sudo chown -R "$fresh_user:$fresh_user" "$setup_bare" "$fresh_home"
          cp "$HOME/.local/bin/mise" "$mise_bin"
          chmod 0755 "$mise_bin"

          fresh_config="$fresh_home/custom/mise"
          run_fresh() {
            sudo -u "$fresh_user" env -i \
              HOME="$fresh_home" \
              XDG_CONFIG_HOME="$fresh_home/.config" \
              XDG_STATE_HOME="$fresh_home/.local/state" \
              MISE_CONFIG_DIR="$fresh_config" \
              MISE_STATE_DIR="$fresh_home/.local/state/mise" \
              MISE_DATA_DIR="$fresh_home/.local/share/mise" \
              MISE_CACHE_DIR="$fresh_home/.cache/mise" \
              MISE_GLOBAL_CONFIG_ROOT="$fresh_home" \
              MISE_TRUSTED_CONFIG_PATHS="$fresh_config" \
              MISE_YES=1 \
              PATH="/usr/local/bin:/usr/bin:/bin" \
              sh -c 'cd "$HOME" && exec "$@"' sh "$@"
          }

          run_fresh "$mise_bin" bootstrap \
            --adopt "file://$setup_bare" \
            --only dotfiles \
            --yes

          sudo test -f "$fresh_config/miserc.toml"
          sudo test ! -e "$fresh_home/.miserc.toml"
          sudo test -f "$fresh_config/config.toml"
          sudo test -f "$fresh_config/config.fcitx-flatpak.toml"
          sudo test -f "$fresh_config/mise.lock"
          sudo test -f "$fresh_config/windows-terminal/keybind.json"
          sudo test ! -e "$fresh_home/.config/mise/config.toml"

          sudo test -f "$fresh_home/.zshrc"
          sudo test ! -L "$fresh_home/.zshrc"
          sudo test -f "$fresh_home/.config/topgrade.toml"
          sudo test ! -L "$fresh_home/.config/topgrade.toml"
          sudo test -f "$fresh_home/.config/fcitx5/profile"
          sudo test ! -L "$fresh_home/.config/fcitx5/profile"

          sudo cmp "$fresh_home/.zshrc" "$GITHUB_WORKSPACE/home/.zshrc"
          sudo cmp "$fresh_home/.config/topgrade.toml" "$GITHUB_WORKSPACE/config/assets/topgrade.toml"
          sudo cmp "$fresh_config/mise.lock" "$GITHUB_WORKSPACE/config/mise.lock"
          sudo cmp "$fresh_config/miserc.toml" "$GITHUB_WORKSPACE/config/miserc.toml"

          paths_json="$(run_fresh "$mise_bin" bootstrap dotfiles paths --json)"
          jq -e 'any(.entries[]; .path == "~/.zshrc" and .mode == "track")' <<<"$paths_json" >/dev/null
          jq -e 'any(.entries[]; .path == "~/custom/mise/mise.lock")' <<<"$paths_json" >/dev/null
          jq -e 'all(.entries[]; (.path | startswith("~/.config/mise/") | not))' <<<"$paths_json" >/dev/null

          config_json="$(run_fresh "$mise_bin" config ls --json)"
          jq -e --arg path "$fresh_config/conf.d/distro.ubuntu.toml" 'any(.[]; .path == $path)' <<<"$config_json" >/dev/null
          jq -e --arg path "$fresh_config/conf.d/packages.apt.toml" 'any(.[]; .path == $path)' <<<"$config_json" >/dev/null

          run_fresh "$mise_bin" bootstrap dotfiles status
