name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          install: false
          cache: false

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Generate hk tooling lock
        run: |
          mise install hk shellcheck
          git diff -- mise.lock
          exit 1

      - name: Prepare bootstrap fixtures
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          sudo install -Dm644 /dev/null /usr/share/applications/com.mitchellh.ghostty.desktop

      - name: Run hk checks
        run: mise exec hk shellcheck -- hk check --all

      - name: Validate mise tasks
        run: mise tasks validate --errors-only

      - name: Validate bootstrap plan
        run: mise --locked bootstrap --dry-run

      - name: Validate mise config selection
        shell: bash
        run: |
          check_config() {
            local envs="$1"
            shift

            local output
            output="$(MISE_ENV="$envs" MISE_ENV_CONF_D=true mise config ls)"
            printf '%s\n' "$output"

            local expected
            for expected in "$@"; do
              if ! grep -Fq "$expected" <<<"$output"; then
                echo "::error::MISE_ENV=$envs did not load $expected"
                return 1
              fi
            done
          }

          check_config "ubuntu,apt" \
            "mise/conf.d/distro.ubuntu.toml" \
            "mise/conf.d/packages.apt.toml"

          check_config "debian,apt" \
            "mise/conf.d/packages.apt.toml"

          check_config "fedora,dnf" \
            "mise/conf.d/distro.fedora.toml" \
            "mise/conf.d/packages.dnf.toml"

          check_config "rhel,dnf" \
            "mise/conf.d/packages.dnf.toml"

          check_config "arch,pacman" \
            "mise/conf.d/packages.pacman.toml"

          check_config "flatpak" \
            "mise.flatpak.toml"
