name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/hk

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.13
          install: false
          cache: false

      - name: Generate mise lock
        run: |
          mise install hk shellcheck
          if ! git diff --quiet -- mise.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mise.lock
            git commit -m "chore: update mise lock"
            git push origin HEAD:feat/hk
          fi
