name: Refresh Tinty lock

on:
  push:
    branches: [chore/use-github-tinty-backend]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      MISE_ENV_CONF_D: "true"
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/config
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/use-github-tinty-backend

      - name: Prepare global mise config
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE/config" "$HOME/.config/mise"

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh lockfile
        run: "$HOME/.local/bin/mise lock --global"

      - name: Commit generated lockfile and remove generator
        run: |
          rm .github/workflows/refresh-tinty-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/mise.lock .github/workflows/refresh-tinty-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Tinty lockfile"
          git push
