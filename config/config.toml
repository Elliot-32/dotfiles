min_version = "2026.9.2"

[settings]
auto_update = true
lockfile = true

[settings.github]
use_git_credentials = true

[settings.history]
sync = "sync"

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.cargo/bin",
]
EDITOR = "code --wait"
VISUAL = "code --wait"
SUDO_EDITOR = "code --wait"

[shell_alias]
ls = "eza --icons=auto"
oc = "opencode"
rm = "gomi"
path = "j $(print -l $path | fzf)"
n = "nvim"
sl = "systemctl"
sudo = "sudo "
update = "topgrade"

[tools]
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
cargo-binstall = "latest"
cowsay = "latest"
dasel = "latest"
doggo = "latest"
duf = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gum = "latest"
gup = "latest"
herdr = "latest"
hk = "latest"
lazyjournal = "latest"
lazyssh = "latest"
neovim = "latest"
node = "latest"
nub = "latest"
opencode = "latest"
qdns = "latest"
ripgrep = "latest"
rust = "latest"
shellcheck = "latest"
sheldon = "latest"
tlrc = "latest"
topgrade = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"
"cargo:rustscan" = { version = "latest", depends = ["rust", "cargo-binstall"] }
"github:Giammarco-Ferranti/deja" = "latest"
"pipx:isd-tui" = "latest"
codex = "latest"
"aqua:kjokjo/ipcalc" = "latest"
"pipx:sqlmap" = "latest"
"pipx:wafw00f" = "latest"
"github:pythops/oryx" = "latest"
"aqua:projectdiscovery/nuclei" = "latest"
"github:pythops/bluetui" = "latest"
"aqua:projectdiscovery/subfinder" = "latest"
"aqua:babarot/gomi" = "latest"
"aqua:fujiapple852/trippy" = "latest"
"aqua:alltuner/mise-completions-sync" = "latest"
"github:pythops/impala" = "latest"
kubectl = "latest"

[dotfiles]
"~/.gitconfig/defaults" = { block = '''
[push]
	autoSetupRemote = true

[fetch]
	prune = true
''' }
"~/.zshrc" = { mode = "track" }
"~/.zshenv" = { mode = "track" }
"~/.zprofile" = { mode = "track" }
"~/.p10k.zsh" = { mode = "track" }
"~/.config/sheldon" = { mode = "track" }
"~/.config/yazi" = { mode = "track" }
"~/.config/gomi/config.yaml" = { mode = "track" }
"~/.config/topgrade.toml" = { mode = "track" }
"~/.config/topgrade.systemd.toml" = { mode = "track" }
"~/.config/ghostty/config" = { mode = "track" }
"~/.config/xdg-terminals.list" = { mode = "track" }
"~/.config/fcitx5/profile" = { mode = "track" }
"~/.config/environment.d/90-fcitx5.conf" = { mode = "track" }
"~/.local/share/mise-completions-sync/registry.toml" = { mode = "track" }

[bootstrap.directories]
"~/.local/share/zsh/site-functions" = {}

[bootstrap.mise_shell_activate]
bash = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.linux.systemd.units.gomi-prune]
description = "Prune gomi trash older than 30 days"
type = "oneshot"
exec_start = "~/.local/bin/mise exec -- gomi --force --prune=30d"
environment = { MISE_CONFIG_DIR = "{{ config_source | canonicalize | dirname }}" }
wanted_by = []
start = false

[bootstrap.linux.systemd.units.gomi-prune-timer]
description = "Hourly gomi trash pruning"
on_calendar = "hourly"
persistent = true
unit = "gomi-prune"

[bootstrap.linux.systemd.units.update]
description = "Run unattended user-session updates with Topgrade"
type = "oneshot"
exec_start = "%h/.local/bin/mise exec -- topgrade --config %h/.config/topgrade.systemd.toml"
environment = { MISE_CONFIG_DIR = "{{ config_source | canonicalize | dirname }}" }
wanted_by = []
start = false

[bootstrap.linux.systemd.units.update-timer]
description = "Daily Topgrade update"
on_calendar = "daily"
persistent = true
unit = "update"

[tasks.bootstrap]
description = "Finish dotfiles bootstrap"
run = [
  "atuin config set --type boolean ai.enabled true",
  "atuin config set --type boolean ai.opening.send_last_command true",
  "mise completion zsh --install",
  "misecompsync --shell zsh",
  "sheldon --non-interactive lock",
  "ya pkg install",
  { task = "update:fonts" },
  { task = "bootstrap:windows" },
  { task = "bootstrap:github" },
]

[tasks."bootstrap:github"]
hide = true
interactive = true
run = "mise exec -- sh \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/login-github.sh\""

[tasks."bootstrap:windows"]
hide = true
run = ":"

[tasks."update:fonts"]
hide = true
run = "bash \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/update-fonts.sh\""

[hooks]
postinstall = "misecompsync --new-only --shell zsh"
