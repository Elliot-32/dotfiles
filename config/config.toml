min_version = "2026.9.10"

[settings]
auto_update = true
lockfile = true

[settings.github]
use_git_credentials = true

[settings.history]
sync = "sync"

[history]
exclude = ["~/.config/yazi/plugins/**"]

[env]
_.path = [
  "{{ env.HOME }}/.local/bin",
  "{{ env.HOME }}/go/bin",
  "{{ env.HOME }}/.cargo/bin",
]
EDITOR = "code --wait"
VISUAL = "code --wait"
SUDO_EDITOR = "code --wait"

[shell_alias]
ls = "eza --icons=auto"
oc = "opencode"
rm = "gomi"
path = "j $(print -l $path | fzf)"
n = "nvim"
sl = "systemctl"
sudo = "run0"
update = "topgrade"

[tools]
atuin = "latest"
bat = "latest"
btop = "latest"
bun = "latest"
cowsay = "latest"
dasel = "latest"
doggo = "latest"
duf = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
glow = "latest"
go = "latest"
gum = "latest"
gup = "latest"
herdr = "latest"
hk = "1.58.1"
lazyjournal = "latest"
lazyssh = "latest"
neovim = "latest"
node = "latest"
nub = "latest"
opencode = "latest"
qdns = "latest"
ripgrep = "latest"
rust = "latest"
shellcheck = "latest"
sheldon = "latest"
tlrc = "latest"
topgrade = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"
"github:tinted-theming/tinty" = "latest"
"github:Giammarco-Ferranti/deja" = "latest"
"pipx:isd-tui" = "latest"
"aqua:kjokjo/ipcalc" = "latest"
"pipx:sqlmap" = "latest"
"pipx:wafw00f" = "latest"
"github:pythops/oryx" = "latest"
"aqua:projectdiscovery/nuclei" = "latest"
"github:pythops/bluetui" = "latest"
"aqua:projectdiscovery/subfinder" = "latest"
"aqua:babarot/gomi" = "latest"
"aqua:fujiapple852/trippy" = "latest"
"aqua:alltuner/mise-completions-sync" = "latest"
"github:pythops/impala" = "latest"
kubectl = "latest"
gh = "latest"
codex = "latest"
cursor-agent = { version = "latest", bin_path = "bin", strip_components = "0", url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(arm64="arm64", x64="x64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }

[tools."github:ryanoasis/nerd-fonts"]
version = "latest"
os = ["linux"]
asset_pattern = "JetBrainsMono.tar.xz"
postinstall = '''
font_dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts/JetBrainsMonoNerdFont"
mkdir -p "$(dirname "$font_dir")"
rm -rf -- "$font_dir"
ln -s "$MISE_TOOL_INSTALL_PATH" "$font_dir"
fc-cache -f "$font_dir"
'''

[dotfiles]
"~/.config/environment.d/90-fcitx5.conf" = { mode = "track" }
"~/.config/fcitx5/conf/classicui.conf" = { mode = "track" }
"~/.config/fcitx5/config" = { mode = "track" }
"~/.config/fcitx5/profile" = { mode = "track" }
"~/.config/ghostty/config" = { mode = "track" }
"~/.config/gtk-3.0/settings.ini" = { mode = "track" }
"~/.config/gtk-4.0/settings.ini" = { mode = "track" }
"~/.config/herdr/config.toml" = { mode = "track" }
"~/.config/sheldon" = { mode = "track" }
"~/.config/tinted-theming/tinty/config.toml" = { mode = "track" }
"~/.config/tinted-theming/tinty/templates" = { mode = "track" }
"~/.config/topgrade.systemd.toml" = { mode = "track" }
"~/.config/topgrade.toml" = { source = "assets/topgrade.toml", mode = "copy" }
"~/.config/xdg-terminals.list" = { mode = "track" }
"~/.config/yazi" = { mode = "track" }
"~/.gitconfig/defaults" = { block = '''
[push]
	autoSetupRemote = true

[fetch]
	prune = true
''' }
"~/.gtkrc-2.0" = { mode = "track" }
"~/.local/share/mise-completions-sync/registry.toml" = { mode = "track" }
"~/.p10k.zsh" = { mode = "track" }
"~/.zprofile" = { mode = "track" }
"~/.zshenv" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[bootstrap.directories]
"~/.local/share/zsh/site-functions" = {}

[bootstrap.hooks.post-packages]
run = '''
if command -v ghostty >/dev/null 2>&1; then
  mkdir -p "$HOME/.local/share/xdg-terminals"
  ln -sfn /usr/share/applications/com.mitchellh.ghostty.desktop "$HOME/.local/share/xdg-terminals/com.mitchellh.ghostty.desktop"
  systemctl enable --user app-com.mitchellh.ghostty.service
fi
'''

[bootstrap.hooks.pre-dotfiles]
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/sync-fcitx5-themes.sh"'

[bootstrap.hooks.post-dotfiles]
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/reload-fcitx5.sh"'

[bootstrap.hooks.final]
run = '''
legacy="$HOME/.miserc.toml"
current="{{ config_root }}/miserc.toml"
if [ -f "$legacy" ] && [ -f "$current" ]; then
  unwrapped="$(mktemp)"
  awk '
    /^# mise-history-preflight body begin$/ { copy = 1; next }
    /^# mise-history-preflight body end$/ { copy = 0; next }
    copy
  ' "$current" >"$unwrapped"

  if cmp -s "$legacy" "$unwrapped"; then
    rm -f -- "$legacy"
  fi
  rm -f -- "$unwrapped"
fi
'''

[bootstrap.mise_shell_activate]
bash = true

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.linux.systemd.units.gomi-prune]
description = "Prune gomi trash older than 30 days"
type = "oneshot"
exec_start = "~/.local/bin/mise exec -- gomi --force --prune=30d"
environment = { MISE_CONFIG_DIR = "{{ env.MISE_CONFIG_DIR | default(value=xdg_config_home ~ '/mise') }}" }
wanted_by = []
start = false

[bootstrap.linux.systemd.units.gomi-prune-timer]
description = "Hourly gomi trash pruning"
on_calendar = "hourly"
persistent = true
unit = "gomi-prune"

[bootstrap.linux.systemd.units.update]
description = "Run unattended user-session updates with Topgrade"
type = "oneshot"
exec_start = "%h/.local/bin/mise exec -- topgrade --config %h/.config/topgrade.systemd.toml"
environment = { MISE_CONFIG_DIR = "{{ env.MISE_CONFIG_DIR | default(value=xdg_config_home ~ '/mise') }}" }
wanted_by = []
start = false

[bootstrap.linux.systemd.units.update-timer]
description = "Daily Topgrade update"
on_calendar = "daily"
persistent = true
unit = "update"

[tasks.bootstrap]
description = "Finish dotfiles bootstrap"
run = [
  "atuin config set --type boolean ai.enabled true",
  "atuin config set --type boolean ai.opening.send_last_command true",
  "mise completion zsh --install",
  "misecompsync --shell zsh",
  "sheldon --non-interactive lock",
  "ya pkg install",
  { task = "bootstrap:windows" },
  { task = "bootstrap:theme" },
  { task = "bootstrap:github" },
]

[tasks."bootstrap:theme"]
hide = true
run = [
  "tinty sync",
  "tinty build \"$HOME/.config/tinted-theming/tinty\" --quiet",
  "tinty init",
  { task = "theme:select" },
]

[tasks."theme:select"]
alias = "theme"
description = "Interactively preview and apply Tinty themes"
hide = false
interactive = true
run = "bash \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/tinty-theme-picker.sh\""

[tasks."bootstrap:github"]
hide = true
interactive = true
run = "mise exec -- sh \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/login-github.sh\""

[tasks."bootstrap:windows"]
hide = true
run = ":"

[hooks]
postinstall = "misecompsync --new-only --shell zsh"
