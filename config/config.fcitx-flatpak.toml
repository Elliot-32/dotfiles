[bootstrap.packages]
"flatpak-user:org.fcitx.Fcitx5" = "latest"
"flatpak-user:org.fcitx.Fcitx5.Addon.McBopomofo" = "latest"

[bootstrap.files."~/.config/autostart/org.fcitx.Fcitx5.desktop"]
content = """
[Desktop Entry]
Type=Application
Name=Fcitx 5
Exec=flatpak run --user org.fcitx.Fcitx5
Icon=org.fcitx.Fcitx5
Terminal=false
X-GNOME-Autostart-enabled=true
"""

[tasks."bootstrap:fcitx5-breeze"]
hide = true
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/install-fcitx5-breeze.sh"'
