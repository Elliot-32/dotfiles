[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:fontconfig" = "latest"
"apt:xz-utils" = "latest"
"apt:pkg-config" = "latest"
"apt:libdbus-1-dev" = "latest"
"apt:cmake" = "latest"
"apt:extra-cmake-modules" = "latest"
"apt:gettext" = "latest"
"apt:libfcitx5core-dev" = "latest"
"apt:libfcitx5config-dev" = "latest"
"apt:libfcitx5utils-dev" = "latest"
"apt:fcitx5-modules-dev" = "latest"
"apt:libfmt-dev" = "latest"
"apt:libicu-dev" = "latest"
"apt:libjson-c-dev" = "latest"
"apt:curl" = "latest"
"apt:nmap" = "latest"
"apt:openssh-client" = "latest"
"apt:zsh" = "latest"
"apt:unattended-upgrades" = "latest"
"apt:fcitx5" = "latest"
"apt:fcitx5-frontend-all" = "latest"
"apt:libnotify-bin" = "latest"
"apt:wl-clipboard" = "latest"
"apt:xdg-terminal-exec" = "latest"
"apt:nala" = "latest"

[bootstrap.hooks.post-packages]
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/install-mcbopomofo.sh"'

[bootstrap.files."/etc/apt/apt.conf.d/20auto-upgrades"]
content = '''
APT::Periodic::Enable "1";
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services."apt-daily.timer"]
enabled = true
state = "running"

[bootstrap.services."apt-daily-upgrade.timer"]
enabled = true
state = "running"

[shell_alias]
apt = "nala"
