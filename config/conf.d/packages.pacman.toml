[settings]
disable_tools = ["github:ryanoasis/nerd-fonts"]

[bootstrap.hooks.pre-packages]
run = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/bootstrap-paru.sh"'

[bootstrap.packages]
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:fontconfig" = "latest"
"pacman:ttf-jetbrains-mono-nerd" = "latest"
"pacman:xz" = "latest"
"pacman:nmap" = "latest"
"pacman:openssh" = "latest"
"pacman:zsh" = "latest"
"pacman:fcitx5" = "latest"
"pacman:fcitx5-chewing" = { state = "absent" }
"aur:paru" = "latest"
"pacman:fcitx5-gtk" = "latest"
"pacman:fcitx5-qt" = "latest"
"pacman:libnotify" = "latest"
"pacman:wl-clipboard" = "latest"
