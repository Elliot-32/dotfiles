[bootstrap.packages]
"dnf:gcc" = "latest"
"dnf:fontconfig" = "latest"
"dnf:xz" = "latest"
"dnf:nmap" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:zsh" = "latest"
"dnf:dnf-automatic" = "latest"
"dnf:fcitx5" = "latest"
"dnf:fcitx5-gtk2" = "latest"
"dnf:fcitx5-gtk3" = "latest"
"dnf:fcitx5-gtk4" = "latest"
"dnf:fcitx5-qt5" = "latest"
"dnf:fcitx5-qt6" = "latest"
"dnf:libnotify" = "latest"
"dnf:wl-clipboard" = "latest"
"dnf:xdg-terminal-exec" = "latest"

[bootstrap.files."~/.config/autostart/org.fcitx.Fcitx5.desktop"]
content = """
[Desktop Entry]
Type=Application
Name=Fcitx 5
Exec=flatpak run --user org.fcitx.Fcitx5
Icon=org.fcitx.Fcitx5
Terminal=false
X-GNOME-Autostart-enabled=true
"""
