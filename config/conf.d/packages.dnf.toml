[bootstrap.packages]
"dnf:gcc" = "latest"
"dnf:fontconfig" = "latest"
"dnf:xz" = "latest"
"dnf:nmap" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:zsh" = "latest"
"dnf:dnf5-plugin-automatic" = "latest"
"dnf:fcitx5" = "latest"
"dnf:fcitx5-chewing" = "latest"
"dnf:fcitx5-gtk2" = "latest"
"dnf:fcitx5-gtk3" = "latest"
"dnf:fcitx5-gtk4" = "latest"
"dnf:fcitx5-qt5" = "latest"
"dnf:fcitx5-qt6" = "latest"
"dnf:libnotify" = "latest"
"dnf:wl-clipboard" = "latest"
"dnf:xdg-terminal-exec" = "latest"

[bootstrap.files."/etc/dnf/automatic.conf"]
content = '''
[commands]
upgrade_type = default
download_updates = true
apply_updates = true
reboot = never
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services."dnf5-automatic.timer"]
enabled = true
state = "running"
