# WSL-specific mise configuration.
# This fragment is loaded only when the `wsl` environment is active.

[env]
SHELDON_PROFILE = "wsl"

[tasks."nerd-font"]
description = "Install or update JetBrainsMono Nerd Font on Windows"
run = '''
script="${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/nerd-font-windows.ps1"
powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w "$script")"
'''

[tasks."nerd-font:update"]
description = "Skip Windows Nerd Font updates during Topgrade"
hide = true
run = ":"
