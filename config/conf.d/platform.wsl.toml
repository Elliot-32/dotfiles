# WSL-specific mise configuration.
# This fragment is loaded only when the `wsl` environment is active.

[env]
SHELDON_PROFILE = "wsl"

[tasks."bootstrap:windows"]
description = "Configure Windows packages and register the Tinty theme import in Windows Terminal"
hide = false
run = "sh \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/bootstrap-windows.sh\""

[tasks."theme:select"]
description = "Interactively preview and apply Tinty themes"
hide = false
interactive = true
run = "bash \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/tinty-theme-picker.sh\""
