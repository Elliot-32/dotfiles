# WSL-specific mise configuration.
# This fragment is loaded only when the `wsl` environment is active.

[env]
SHELDON_PROFILE = "wsl"

[dotfiles]
"~/.config/palette/config.toml" = { mode = "track" }
"~/.config/palette/template/palette.json" = { mode = "track" }

[tasks."bootstrap:windows"]
description = "Configure Windows packages and register the Palette import in Windows Terminal"
hide = false
run = "sh \"${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/bootstrap-windows.sh\""
