[bootstrap.hooks.pre-packages]
run = [
  "if rpm -q dnf-automatic >/dev/null 2>&1; then sudo dnf5 swap -y dnf-automatic dnf5-plugin-automatic; fi",
  'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/bootstrap-ghostty-fedora.sh"',
]

[bootstrap.packages]
"dnf:ghostty" = "latest"
"dnf:dnf5-plugin-automatic" = "latest"

[bootstrap.files."/etc/dnf/automatic.conf"]
content = '''
[commands]
upgrade_type = default
download_updates = true
apply_updates = true
reboot = never
'''
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services."dnf5-automatic.timer"]
enabled = true
state = "running"
