[misc]
assume_yes = true
ask_retry = false
notify_end = "never"
sudo_loop = true
disable = [
  # Managed by mise; keep Topgrade steps that only update plugins/data.
  "atuin",
  "bun",
  "bun_packages",
  "cargo",
  "codex",
  "go",
  "node",
  "opencode",
  "pipx",
  "rustup",
  "self_update",
  "uv",
]

[git]
pull_predefined = false

[flatpak]
use_sudo = false

[commands]
"Fcitx5 themes" = 'sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/sync-fcitx5-themes.sh" && sh "${MISE_CONFIG_DIR:-$HOME/.config/mise}/scripts/reload-fcitx5.sh"'

[post_commands]
"Refresh completions" = 'mise completion zsh --install && misecompsync --shell zsh'
