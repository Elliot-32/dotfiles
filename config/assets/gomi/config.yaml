core:
  trash:
    strategy: xdg
    home_fallback: true
    forbidden_paths:
      - "$HOME/.local/share/Trash"
      - "$HOME/.trash"
      - "$XDG_DATA_HOME/Trash"
      - "/tmp/Trash"
      - "/var/tmp/Trash"
      - "$HOME/.gomi"
      - "$HOME/.config/mise"
      - "$MISE_CONFIG_DIR"
      - "$HOME/.miserc.toml"
      - "$HOME/.config/gomi/config.yaml"
      - "$HOME/.zshrc"
      - "$HOME/.zprofile"
      - "$HOME/.config/sheldon"
      - "$HOME/.config/topgrade.toml"
      - "$HOME/.config/topgrade.systemd.toml"
      - "/"
      - "/etc"
      - "/usr"
      - "/var"
      - "/bin"
      - "/sbin"
      - "/lib"
      - "/lib64"

ui:
  preview:
    syntax_highlight: true
    colorscheme: catppuccin-mocha
    directory_command: eza -la --icons=always --color=always
  style:
    list_view:
      cursor: "#AD58B4"
      selected: "#5FB458"
      filter_match: "#F39C12"
      filter_prompt: "#7AA2F7"
      indent_on_select: false
    detail_view:
      border: "#FFFFFF"
      info_pane:
        deleted_from:
          fg: "#EEEEEE"
          bg: "#1C1C1C"
        deleted_at:
          fg: "#EEEEEE"
          bg: "#1C1C1C"
      preview_pane:
        border: "#3C3C3C"
        size:
          fg: "#EEEEDD"
          bg: "#3C3C3C"
        scroll:
          fg: "#EEEEDD"
          bg: "#3C3C3C"
    deletion_dialog: "#FF007F"

logging:
  enabled: true
  level: info
  rotation:
    max_size: 10MB
    max_files: 3
